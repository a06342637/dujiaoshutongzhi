name: Verify, build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: '可选：补发已经存在的版本标签，例如 v0.1.0；留空仅验证'
        required: false
        type: string
env:
  PUBLISH_TAG: ${{ inputs.publish_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check requested release matches source version
        run: node -e "const t=process.env.PUBLISH_TAG; if(t && (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(t) || t!=='v'+require('./package.json').version)) process.exit(1)"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package platform independent application update
        run: |
          npm prune --omit=dev
          npm run release:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: application-update
          path: release/*
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH_TAG != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.PUBLISH_TAG }},enable=${{ env.PUBLISH_TAG != '' }}
            type=raw,value=latest,enable=${{ env.PUBLISH_TAG != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH_TAG != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published runtime on both architectures
        if: env.PUBLISH_TAG != ''
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${PUBLISH_TAG#v}"
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --read-only --tmpfs /tmp "$image" node --input-type=module -e "import {Store} from './dist/src/store.js'; import {VERSION} from './dist/src/version.js'; import {atomicJSON} from './dist/src/update-files.js'; if(process.getuid()===0) throw new Error('Root runtime'); const s=new Store('/data/smoke.sqlite'); s.saveConfig(s.config()); s.close(); atomicJSON('/data/smoke-update.json',{version:VERSION}); console.log('Runtime verified',process.arch,VERSION);"
          done
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: application-update
          path: release
      - name: Publish complete release after image and update bundle succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.PUBLISH_TAG }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) process.exit(1)"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
